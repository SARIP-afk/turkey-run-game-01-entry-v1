<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run — Escape Thanksgiving Dinner</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d130b; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    display: block;
    touch-action: none;
    background: #f7b267;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Turkey Run: a turkey escapes Thanksgiving dinner. Jump the fences and the oven, duck the carving knives, hide in the haystacks, and do not let the farmer catch you."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
